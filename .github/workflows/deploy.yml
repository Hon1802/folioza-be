name: Deploy develop

on:
  push:
    branches: ['develop', 'stg/*'] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Docker
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    # Build Docker image
    - name: Build Docker Image
      run: |
          docker buildx build \
            --platform linux/amd64 \
            -t folioza-be \
            --load .
    # Save Docker image as a tar file
    - name: Save Docker Image
      run: |
        docker save folioza-be > folioza-be.tar

    # Transfer Docker image to VPS
    - name: Transfer Docker Image to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_IP_STG }}
        username: ${{ secrets.VPS_USER_STG }}
        key: ${{ secrets.VPS_KEY_STG }}
        source: folioza-be.tar
        target: ~/folioza/folioza-be

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    # SSH into VPS and Deploy
    - name: SSH into VPS and Deploy
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_IP_STG }}
        username: ${{ secrets.VPS_USER_STG }}
        key: ${{ secrets.VPS_KEY_STG }}
        script: |
          # Load the Docker image
          cd ~/folioza/folioza-be
          docker load < ~/folioza/folioza-be/folioza-be.tar
          docker stop backend-dev || true
          docker rm backend-dev || true
          docker compose up -d